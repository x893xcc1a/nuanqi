version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: nuanqi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: your_mysql_password
      MYSQL_DATABASE: nuanqi
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - nuanqi-network
    command: --default-authentication-plugin=mysql_native_password

  # Node.js后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nuanqi-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nuanqi
      DB_USER: root
      DB_PASSWORD: your_mysql_password
      JWT_SECRET: your_jwt_secret_key_change_this
      WECHAT_APPID: your_wechat_appid
      WECHAT_SECRET: your_wechat_secret
      WECHAT_MCH_ID: your_merchant_id
      WECHAT_API_KEY: your_api_key
      WECHAT_NOTIFY_URL: https://nuanqi.com/api/v1/pay/notify
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - nuanqi-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: nuanqi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./h5/dist:/var/www/nuanqi/h5
      - ./admin/dist:/var/www/nuanqi/admin
      - ./uploads:/var/www/nuanqi/uploads
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - server
    networks:
      - nuanqi-network

volumes:
  mysql_data:

networks:
  nuanqi-network:
    driver: bridge
