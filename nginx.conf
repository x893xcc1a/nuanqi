# 暖栖港湾 - Nginx配置
# 【微信H5专用】强制HTTPS，微信要求所有网页授权和支付必须在HTTPS下进行

server {
    listen 80;
    server_name nuanqi.com www.nuanqi.com;
    
    # HTTP重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nuanqi.com www.nuanqi.com;
    
    # SSL证书配置（请替换为实际证书路径）
    ssl_certificate /path/to/your/ssl.crt;
    ssl_certificate_key /path/to/your/ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # 用户端H5 - 根路径
    location / {
        root /var/www/nuanqi/h5;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 【防坑提示】H5使用hash路由，所有路由都返回index.html
        # 微信授权回调路径也由前端处理
    }
    
    # 后台管理系统
    location /admin {
        alias /var/www/nuanqi/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    
    # API反向代理
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 【微信H5专用】支付回调需要较长的超时时间
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 上传文件
    location /uploads {
        alias /var/www/nuanqi/uploads;
        expires 7d;
    }
}
